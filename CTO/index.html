<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indonesian-English Vocabulary Game</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #06b6d4;
            --accent-color: #f59e0b;
            --success-color: #10b981;
            --error-color: #ef4444;
            --background-color: #f8fafc;
            --card-background: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--text-primary);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: var(--card-background);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .header-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .select, .btn {
            padding: 10px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: var(--card-background);
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .select:focus, .btn:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .btn {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .btn:hover {
            background: #4338ca;
            border-color: #4338ca;
        }

        .btn.secondary {
            background: var(--secondary-color);
            border-color: var(--secondary-color);
        }

        .btn.secondary:hover {
            background: #0891b2;
            border-color: #0891b2;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .game-area {
            background: var(--card-background);
            border-radius: 12px;
            padding: 30px;
            box-shadow: var(--shadow);
            min-height: 400px;
        }

        .game-modes {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .game-mode-btn {
            padding: 12px 20px;
            background: var(--background-color);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .game-mode-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .game-mode-btn:hover {
            border-color: var(--primary-color);
        }

        .flashcard {
            background: var(--background-color);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .flashcard:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .flashcard-front, .flashcard-back {
            display: none;
        }

        .flashcard.show-front .flashcard-front {
            display: block;
        }

        .flashcard.show-back .flashcard-back {
            display: block;
        }

        .word {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .translation {
            font-size: 18px;
            color: var(--text-secondary);
        }

        .pronunciation {
            font-size: 14px;
            color: var(--accent-color);
            margin-top: 10px;
            font-style: italic;
        }

        .multiple-choice {
            display: grid;
            gap: 15px;
        }

        .choice-btn {
            padding: 15px 20px;
            background: var(--background-color);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            font-size: 16px;
        }

        .choice-btn:hover {
            border-color: var(--primary-color);
            background: #f1f5f9;
        }

        .choice-btn.correct {
            background: var(--success-color);
            color: white;
            border-color: var(--success-color);
        }

        .choice-btn.incorrect {
            background: var(--error-color);
            color: white;
            border-color: var(--error-color);
        }

        .matching-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .matching-column {
            display: grid;
            gap: 10px;
        }

        .matching-item {
            padding: 15px;
            background: var(--background-color);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .matching-item:hover {
            border-color: var(--primary-color);
        }

        .matching-item.selected {
            border-color: var(--primary-color);
            background: var(--primary-color);
            color: white;
        }

        .matching-item.matched {
            background: var(--success-color);
            color: white;
            border-color: var(--success-color);
        }

        .listening-controls {
            text-align: center;
            margin-bottom: 20px;
        }

        .listen-btn {
            padding: 15px 30px;
            background: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .listen-btn:hover {
            background: #0891b2;
            transform: scale(1.05);
        }

        .sidebar {
            background: var(--card-background);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
            height: fit-content;
        }

        .stats {
            margin-bottom: 30px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .stat-label {
            color: var(--text-secondary);
        }

        .stat-value {
            font-weight: bold;
            color: var(--primary-color);
        }

        .progress-bar {
            background: var(--border-color);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-fill {
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            height: 100%;
            transition: width 0.3s ease;
        }

        .level-system {
            text-align: center;
            margin-bottom: 20px;
        }

        .level-badge {
            background: linear-gradient(45deg, var(--accent-color), var(--primary-color));
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }

        .leaderboard {
            margin-top: 30px;
        }

        .leaderboard h3 {
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: var(--background-color);
            border-radius: 6px;
            margin-bottom: 5px;
        }

        .leaderboard-item.current-user {
            background: var(--primary-color);
            color: white;
        }

        .settings {
            margin-top: 30px;
        }

        .settings h3 {
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        .setting-item {
            margin-bottom: 15px;
        }

        .setting-label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .setting-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .feedback.success {
            background: var(--success-color);
            color: white;
        }

        .feedback.error {
            background: var(--error-color);
            color: white;
        }

        .hidden {
            display: none;
        }

        .daily-challenge {
            background: linear-gradient(45deg, var(--accent-color), #f97316);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        .daily-challenge h3 {
            margin-bottom: 10px;
        }

        .challenge-progress {
            background: rgba(255, 255, 255, 0.2);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .challenge-fill {
            background: white;
            height: 100%;
            transition: width 0.3s ease;
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }

            .game-area {
                padding: 20px;
            }

            .word {
                font-size: 24px;
            }

            .matching-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🌏 Indonesian-English Vocabulary Game</div>
            <div class="header-controls">
                <select id="difficultySelect" class="select">
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>
                <select id="languageSelect" class="select">
                    <option value="en-id">English → Indonesian</option>
                    <option value="id-en">Indonesian → English</option>
                </select>
                <button id="settingsBtn" class="btn">⚙️ Settings</button>
            </div>
        </div>

        <div class="daily-challenge">
            <h3>🏆 Daily Challenge</h3>
            <p id="dailyChallengeText">Learn 10 words today!</p>
            <div class="challenge-progress">
                <div id="challengeFill" class="challenge-fill" style="width: 0%"></div>
            </div>
        </div>

        <div class="main-content">
            <div class="game-area">
                <div class="game-modes">
                    <button class="game-mode-btn active" data-mode="flashcard">📚 Flashcards</button>
                    <button class="game-mode-btn" data-mode="multiple-choice">❓ Multiple Choice</button>
                    <button class="game-mode-btn" data-mode="matching">🔗 Matching</button>
                    <button class="game-mode-btn" data-mode="listening">🎧 Listening</button>
                </div>

                <div id="flashcardMode" class="game-mode">
                    <div class="flashcard" id="flashcard">
                        <div class="flashcard-front">
                            <div class="word" id="flashcardWord">Click to reveal</div>
                            <div class="pronunciation" id="flashcardPronunciation"></div>
                        </div>
                        <div class="flashcard-back">
                            <div class="word" id="flashcardTranslation">Translation</div>
                        </div>
                    </div>
                    <div style="text-align: center;">
                        <button id="nextFlashcard" class="btn">Next Word</button>
                    </div>
                </div>

                <div id="multipleChoiceMode" class="game-mode hidden">
                    <div class="question" id="multipleChoiceQuestion">
                        <div class="word" id="multipleChoiceWord">Question</div>
                        <div class="multiple-choice" id="multipleChoiceOptions">
                            <!-- Options will be generated here -->
                        </div>
                    </div>
                </div>

                <div id="matchingMode" class="game-mode hidden">
                    <div class="matching-grid">
                        <div class="matching-column" id="matchingWords">
                            <!-- Words will be generated here -->
                        </div>
                        <div class="matching-column" id="matchingTranslations">
                            <!-- Translations will be generated here -->
                        </div>
                    </div>
                    <div style="text-align: center;">
                        <button id="resetMatching" class="btn secondary">Reset Matching</button>
                    </div>
                </div>

                <div id="listeningMode" class="game-mode hidden">
                    <div class="listening-controls">
                        <button id="playAudio" class="listen-btn">🔊 Play Audio</button>
                    </div>
                    <div class="multiple-choice" id="listeningOptions">
                        <!-- Options will be generated here -->
                    </div>
                </div>

                <div id="feedback" class="feedback hidden"></div>
            </div>

            <div class="sidebar">
                <div class="stats">
                    <h3>📊 Statistics</h3>
                    <div class="stat-item">
                        <span class="stat-label">Score</span>
                        <span class="stat-value" id="score">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Streak</span>
                        <span class="stat-value" id="streak">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Accuracy</span>
                        <span class="stat-value" id="accuracy">0%</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Words Learned</span>
                        <span class="stat-value" id="wordsLearned">0</span>
                    </div>
                </div>

                <div class="level-system">
                    <div class="level-badge" id="levelBadge">Beginner</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="levelProgress" style="width: 0%"></div>
                    </div>
                    <small id="levelText">0 / 100 XP</small>
                </div>

                <div class="leaderboard">
                    <h3>🏆 Leaderboard</h3>
                    <div id="leaderboardList">
                        <!-- Leaderboard items will be generated here -->
                    </div>
                </div>

                <div class="settings">
                    <h3>⚙️ Settings</h3>
                    <div class="setting-item">
                        <label class="setting-label">Username</label>
                        <input type="text" id="usernameInput" class="setting-input" placeholder="Enter your name">
                    </div>
                    <div class="setting-item">
                        <label class="setting-label">Difficulty</label>
                        <select id="settingDifficulty" class="setting-input">
                            <option value="easy">Easy</option>
                            <option value="medium">Medium</option>
                            <option value="hard">Hard</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label class="setting-label">Language Direction</label>
                        <select id="settingLanguage" class="setting-input">
                            <option value="en-id">English → Indonesian</option>
                            <option value="id-en">Indonesian → English</option>
                        </select>
                    </div>
                    <button id="saveSettings" class="btn" style="width: 100%; margin-top: 10px;">Save Settings</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        class VocabularyGame {
            constructor() {
                this.vocabulary = {
                    easy: [
                        { id: 1, english: 'book', indonesian: 'buku', pronunciation: 'BOO-koo' },
                        { id: 2, english: 'house', indonesian: 'rumah', pronunciation: 'ROO-mah' },
                        { id: 3, english: 'water', indonesian: 'air', pronunciation: 'AH-yer' },
                        { id: 4, english: 'food', indonesian: 'makanan', pronunciation: 'mah-KAH-nan' },
                        { id: 5, english: 'car', indonesian: 'mobil', pronunciation: 'MO-beel' },
                        { id: 6, english: 'tree', indonesian: 'pohon', pronunciation: 'PO-hon' },
                        { id: 7, english: 'sun', indonesian: 'matahari', pronunciation: 'mah-tah-HAH-ree' },
                        { id: 8, english: 'moon', indonesian: 'bulan', pronunciation: 'BOO-lan' },
                        { id: 9, english: 'love', indonesian: 'cinta', pronunciation: 'CHEEN-tah' },
                        { id: 10, english: 'friend', indonesian: 'teman', pronunciation: 'TEH-man' }
                    ],
                    medium: [
                        { id: 11, english: 'adventure', indonesian: 'petualangan', pronunciation: 'pet-wah-LAHNG-an' },
                        { id: 12, english: 'beautiful', indonesian: 'indah', pronunciation: 'IN-dah' },
                        { id: 13, english: 'intelligence', indonesian: 'kecerdasan', pronunciation: 'keh-jer-DAH-san' },
                        { id: 14, english: 'opportunity', indonesian: 'kesempatan', pronunciation: 'kes-em-PAH-tan' },
                        { id: 15, english: 'determination', indonesian: 'keteguhan', pronunciation: 'keh-teh-GOO-han' },
                        { id: 16, english: 'wonderful', indonesian: 'luar biasa', pronunciation: 'LOO-ar bee-AH-sah' },
                        { id: 17, english: 'knowledge', indonesian: 'pengetahuan', pronunciation: 'peng-eh-TAH-hoo-an' },
                        { id: 18, english: 'experience', indonesian: 'pengalaman', pronunciation: 'peng-AH-lah-man' },
                        { id: 19, english: 'university', indonesian: 'universitas', pronunciation: 'oo-nee-ver-SEE-tahs' },
                        { id: 20, english: 'environment', indonesian: 'lingkungan', pronunciation: 'ling-KOO-ng-an' }
                    ],
                    hard: [
                        { id: 21, english: 'sophisticated', indonesian: 'sophisticated', pronunciation: 'sof-iss-TI-ka-ted' },
                        { id: 22, english: 'extraordinary', indonesian: 'luar biasa', pronunciation: 'eks-trah-or-DEH-ner-ee' },
                        { id: 23, english: 'comprehensive', indonesian: 'komprehensif', pronunciation: 'kom-preh-HEN-siv' },
                        { id: 24, english: 'entrepreneurship', indonesian: 'kewirausahaan', pronunciation: 'on-tre-pre-NER-ship' },
                        { id: 25, english: 'responsibility', indonesian: 'tanggung jawab', pronunciation: 're-spon-si-BIL-i-tee' },
                        { id: 26, english: 'appreciation', indonesian: 'penghargaan', pronunciation: 'ah-pre-see-AY-shun' },
                        { id: 27, english: 'imagination', indonesian: 'imajinasi', pronunciation: 'im-aj-i-NAY-shun' },
                        { id: 28, english: 'communication', indonesian: 'komunikasi', pronunciation: 'kom-mu-ni-KAY-shun' },
                        { id: 29, english: 'achievement', indonesian: 'pencapaian', pronunciation: 'ah-CHEEV-ment' },
                        { id: 30, english: 'motivation', indonesian: 'motivasi', pronunciation: 'mo-ti-VAY-shun' }
                    ]
                };

                this.currentDifficulty = 'easy';
                this.currentLanguage = 'en-id';
                this.currentMode = 'flashcard';
                this.currentWordIndex = 0;
                this.currentWords = [];
                this.score = 0;
                this.streak = 0;
                this.totalAttempts = 0;
                this.correctAttempts = 0;
                this.wordsLearned = new Set();
                this.userXP = 0;
                this.userLevel = 'Beginner';
                this.username = localStorage.getItem('vocabularyGame_username') || 'Player';
                this.selectedMatchingItems = [];
                this.matchedPairs = new Set();
                this.dailyWordsLearned = parseInt(localStorage.getItem('dailyWordsLearned') || '0');
                
                this.initializeGame();
                this.setupEventListeners();
                this.updateUI();
            }

            initializeGame() {
                this.loadCurrentWords();
                this.setupLeaderboard();
                this.updateDailyChallenge();
                this.loadUserProgress();
            }

            loadCurrentWords() {
                this.currentWords = [...this.vocabulary[this.currentDifficulty]];
                this.shuffleArray(this.currentWords);
                this.currentWordIndex = 0;
            }

            shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }

            setupEventListeners() {
                // Header controls
                document.getElementById('difficultySelect').addEventListener('change', (e) => {
                    this.changeDifficulty(e.target.value);
                });

                document.getElementById('languageSelect').addEventListener('change', (e) => {
                    this.changeLanguage(e.target.value);
                });

                // Game mode buttons
                document.querySelectorAll('.game-mode-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.switchMode(e.target.dataset.mode);
                    });
                });

                // Flashcard controls
                document.getElementById('flashcard').addEventListener('click', () => {
                    this.toggleFlashcard();
                });

                document.getElementById('nextFlashcard').addEventListener('click', () => {
                    this.nextFlashcard();
                });

                // Multiple choice
                document.getElementById('multipleChoiceOptions').addEventListener('click', (e) => {
                    if (e.target.classList.contains('choice-btn')) {
                        this.checkMultipleChoiceAnswer(e.target);
                    }
                });

                // Matching game
                document.getElementById('matchingWords').addEventListener('click', (e) => {
                    if (e.target.classList.contains('matching-item')) {
                        this.selectMatchingItem(e.target, 'word');
                    }
                });

                document.getElementById('matchingTranslations').addEventListener('click', (e) => {
                    if (e.target.classList.contains('matching-item')) {
                        this.selectMatchingItem(e.target, 'translation');
                    }
                });

                document.getElementById('resetMatching').addEventListener('click', () => {
                    this.resetMatching();
                });

                // Listening mode
                document.getElementById('playAudio').addEventListener('click', () => {
                    this.playAudio();
                });

                document.getElementById('listeningOptions').addEventListener('click', (e) => {
                    if (e.target.classList.contains('choice-btn')) {
                        this.checkListeningAnswer(e.target);
                    }
                });

                // Settings
                document.getElementById('settingsBtn').addEventListener('click', () => {
                    this.toggleSettings();
                });

                document.getElementById('saveSettings').addEventListener('click', () => {
                    this.saveSettings();
                });

                // Load initial settings
                document.getElementById('usernameInput').value = this.username;
                document.getElementById('settingDifficulty').value = this.currentDifficulty;
                document.getElementById('settingLanguage').value = this.currentLanguage;
            }

            changeDifficulty(difficulty) {
                this.currentDifficulty = difficulty;
                this.loadCurrentWords();
                this.showFeedback(`Difficulty changed to ${difficulty}`, 'success');
                this.updateUI();
            }

            changeLanguage(language) {
                this.currentLanguage = language;
                this.showFeedback(`Language direction changed`, 'success');
                this.updateUI();
            }

            switchMode(mode) {
                this.currentMode = mode;
                document.querySelectorAll('.game-mode-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                document.querySelector(`[data-mode="${mode}"]`).classList.add('active');

                document.querySelectorAll('.game-mode').forEach(modeDiv => {
                    modeDiv.classList.add('hidden');
                });

                document.getElementById(`${mode}Mode`).classList.remove('hidden');
                
                this.initializeCurrentMode();
            }

            initializeCurrentMode() {
                switch (this.currentMode) {
                    case 'flashcard':
                        this.showFlashcard();
                        break;
                    case 'multiple-choice':
                        this.showMultipleChoice();
                        break;
                    case 'matching':
                        this.showMatching();
                        break;
                    case 'listening':
                        this.showListening();
                        break;
                }
            }

            showFlashcard() {
                const flashcard = document.getElementById('flashcard');
                flashcard.className = 'flashcard show-front';
                this.showFeedback('Click the flashcard to reveal the translation', 'success');
            }

            toggleFlashcard() {
                const flashcard = document.getElementById('flashcard');
                if (flashcard.classList.contains('show-front')) {
                    flashcard.classList.remove('show-front');
                    flashcard.classList.add('show-back');
                } else {
                    flashcard.classList.remove('show-back');
                    flashcard.classList.add('show-front');
                }
            }

            nextFlashcard() {
                this.currentWordIndex = (this.currentWordIndex + 1) % this.currentWords.length;
                this.showFlashcard();
                this.updateFlashcardContent();
            }

            updateFlashcardContent() {
                const word = this.currentWords[this.currentWordIndex];
                const isEnglishFirst = this.currentLanguage === 'en-id';
                
                document.getElementById('flashcardWord').textContent = 
                    isEnglishFirst ? word.english : word.indonesian;
                document.getElementById('flashcardPronunciation').textContent = word.pronunciation;
                document.getElementById('flashcardTranslation').textContent = 
                    isEnglishFirst ? word.indonesian : word.english;
            }

            showMultipleChoice() {
                const word = this.currentWords[this.currentWordIndex];
                const isEnglishFirst = this.currentLanguage === 'en-id';
                const question = isEnglishFirst ? word.english : word.indonesian;
                const correctAnswer = isEnglishFirst ? word.indonesian : word.english;

                document.getElementById('multipleChoiceWord').textContent = question;

                const options = [correctAnswer];
                const allWords = Object.values(this.vocabulary).flat();
                
                while (options.length < 4) {
                    const randomWord = allWords[Math.floor(Math.random() * allWords.length)];
                    const option = isEnglishFirst ? randomWord.indonesian : randomWord.english;
                    
                    if (!options.includes(option) && option !== correctAnswer) {
                        options.push(option);
                    }
                }

                this.shuffleArray(options);

                const optionsContainer = document.getElementById('multipleChoiceOptions');
                optionsContainer.innerHTML = '';
                options.forEach(option => {
                    const button = document.createElement('button');
                    button.className = 'choice-btn';
                    button.textContent = option;
                    button.dataset.correct = option === correctAnswer;
                    optionsContainer.appendChild(button);
                });

                this.showFeedback('Select the correct translation', 'success');
            }

            checkMultipleChoiceAnswer(button) {
                const isCorrect = button.dataset.correct === 'true';
                this.processAnswer(isCorrect);
                
                if (isCorrect) {
                    button.classList.add('correct');
                    this.showFeedback('Correct! +10 points', 'success');
                } else {
                    button.classList.add('incorrect');
                    this.showFeedback('Incorrect! Try again', 'error');
                }

                setTimeout(() => {
                    this.showMultipleChoice();
                    this.currentWordIndex = (this.currentWordIndex + 1) % this.currentWords.length;
                }, 1500);
            }

            showMatching() {
                this.selectedMatchingItems = [];
                this.matchedPairs = new Set();
                
                const wordsContainer = document.getElementById('matchingWords');
                const translationsContainer = document.getElementById('matchingTranslations');
                
                wordsContainer.innerHTML = '';
                translationsContainer.innerHTML = '';

                const currentSet = this.currentWords.slice(0, 6); // Show 6 pairs max
                
                currentSet.forEach((word, index) => {
                    const isEnglishFirst = this.currentLanguage === 'en-id';
                    
                    // Word side
                    const wordElement = document.createElement('div');
                    wordElement.className = 'matching-item';
                    wordElement.textContent = isEnglishFirst ? word.english : word.indonesian;
                    wordElement.dataset.wordId = word.id;
                    wordElement.dataset.type = 'word';
                    wordsContainer.appendChild(wordElement);

                    // Translation side
                    const translationElement = document.createElement('div');
                    translationElement.className = 'matching-item';
                    translationElement.textContent = isEnglishFirst ? word.indonesian : word.english;
                    translationElement.dataset.wordId = word.id;
                    translationElement.dataset.type = 'translation';
                    translationsContainer.appendChild(translationElement);
                });

                this.showFeedback('Match the words with their translations', 'success');
            }

            selectMatchingItem(element, type) {
                if (this.matchedPairs.has(element.dataset.wordId)) {
                    return;
                }

                if (element.classList.contains('selected')) {
                    element.classList.remove('selected');
                    this.selectedMatchingItems = this.selectedMatchingItems.filter(item => 
                        item.element !== element
                    );
                    return;
                }

                element.classList.add('selected');
                this.selectedMatchingItems.push({
                    element: element,
                    wordId: element.dataset.wordId,
                    type: type
                });

                if (this.selectedMatchingItems.length === 2) {
                    this.checkMatching();
                }
            }

            checkMatching() {
                const [first, second] = this.selectedMatchingItems;
                
                if (first.wordId === second.wordId && first.type !== second.type) {
                    // Correct match
                    this.matchedPairs.add(first.wordId);
                    first.element.classList.remove('selected');
                    second.element.classList.remove('selected');
                    first.element.classList.add('matched');
                    second.element.classList.add('matched');
                    
                    this.processAnswer(true);
                    this.showFeedback('Correct match! +15 points', 'success');
                    
                    if (this.matchedPairs.size === 6) {
                        setTimeout(() => {
                            this.showFeedback('All pairs matched! Great job!', 'success');
                            this.resetMatching();
                        }, 1000);
                    }
                } else {
                    // Incorrect match
                    first.element.classList.remove('selected');
                    second.element.classList.remove('selected');
                    this.processAnswer(false);
                    this.showFeedback('Incorrect match. Try again!', 'error');
                }

                this.selectedMatchingItems = [];
            }

            resetMatching() {
                this.showMatching();
            }

            showListening() {
                const word = this.currentWords[this.currentWordIndex];
                const isEnglishFirst = this.currentLanguage === 'en-id';
                const audioText = isEnglishFirst ? word.english : word.indonesian;

                document.getElementById('playAudio').textContent = `🔊 ${audioText}`;
                
                const correctAnswer = isEnglishFirst ? word.indonesian : word.english;
                const options = [correctAnswer];
                const allWords = Object.values(this.vocabulary).flat();
                
                while (options.length < 4) {
                    const randomWord = allWords[Math.floor(Math.random() * allWords.length)];
                    const option = isEnglishFirst ? randomWord.indonesian : randomWord.english;
                    
                    if (!options.includes(option) && option !== correctAnswer) {
                        options.push(option);
                    }
                }

                this.shuffleArray(options);

                const optionsContainer = document.getElementById('listeningOptions');
                optionsContainer.innerHTML = '';
                options.forEach(option => {
                    const button = document.createElement('button');
                    button.className = 'choice-btn';
                    button.textContent = option;
                    button.dataset.correct = option === correctAnswer;
                    optionsContainer.appendChild(button);
                });

                this.showFeedback('Listen and select the correct translation', 'success');
            }

            playAudio() {
                // Simulate audio playback with visual feedback
                const playBtn = document.getElementById('playAudio');
                playBtn.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    playBtn.style.transform = 'scale(1)';
                }, 150);
                
                this.showFeedback('🔊 Audio played (simulated)', 'success');
            }

            checkListeningAnswer(button) {
                const isCorrect = button.dataset.correct === 'true';
                this.processAnswer(isCorrect);
                
                if (isCorrect) {
                    button.classList.add('correct');
                    this.showFeedback('Correct! +10 points', 'success');
                } else {
                    button.classList.add('incorrect');
                    this.showFeedback('Incorrect! Try again', 'error');
                }

                setTimeout(() => {
                    this.showListening();
                    this.currentWordIndex = (this.currentWordIndex + 1) % this.currentWords.length;
                }, 1500);
            }

            processAnswer(isCorrect) {
                this.totalAttempts++;
                
                if (isCorrect) {
                    this.correctAttempts++;
                    this.streak++;
                    
                    let points = 0;
                    switch (this.currentMode) {
                        case 'flashcard':
                            points = 5;
                            break;
                        case 'multiple-choice':
                            points = 10;
                            break;
                        case 'matching':
                            points = 15;
                            break;
                        case 'listening':
                            points = 10;
                            break;
                    }
                    
                    // Bonus for streak
                    points += Math.min(this.streak * 2, 20);
                    
                    this.score += points;
                    this.userXP += points;
                    this.wordsLearned.add(this.currentWords[this.currentWordIndex].id);
                    this.dailyWordsLearned++;
                    
                    this.updateUserLevel();
                    this.saveProgress();
                } else {
                    this.streak = 0;
                }

                this.updateUI();
            }

            updateUserLevel() {
                if (this.userXP >= 1000) {
                    this.userLevel = 'Master';
                } else if (this.userXP >= 500) {
                    this.userLevel = 'Expert';
                } else if (this.userXP >= 250) {
                    this.userLevel = 'Advanced';
                } else if (this.userXP >= 100) {
                    this.userLevel = 'Intermediate';
                } else {
                    this.userLevel = 'Beginner';
                }
            }

            updateUI() {
                document.getElementById('score').textContent = this.score;
                document.getElementById('streak').textContent = this.streak;
                document.getElementById('accuracy').textContent = 
                    this.totalAttempts > 0 ? 
                    Math.round((this.correctAttempts / this.totalAttempts) * 100) + '%' : '0%';
                document.getElementById('wordsLearned').textContent = this.wordsLearned.size;
                document.getElementById('levelBadge').textContent = this.userLevel;
                document.getElementById('levelProgress').style.width = 
                    Math.min((this.userXP % 100), 100) + '%';
                document.getElementById('levelText').textContent = 
                    `${this.userXP % 100} / 100 XP`;
            }

            showFeedback(message, type) {
                const feedback = document.getElementById('feedback');
                feedback.textContent = message;
                feedback.className = `feedback ${type}`;
                feedback.classList.remove('hidden');
                
                setTimeout(() => {
                    feedback.classList.add('hidden');
                }, 2000);
            }

            setupLeaderboard() {
                const defaultLeaderboard = [
                    { name: 'Alice', score: 850 },
                    { name: 'Bob', score: 720 },
                    { name: 'Charlie', score: 650 },
                    { name: 'Diana', score: 580 },
                    { name: 'Eve', score: 520 }
                ];

                const leaderboard = JSON.parse(localStorage.getItem('vocabularyGame_leaderboard') || 
                    JSON.stringify(defaultLeaderboard));
                
                // Add current user if not in leaderboard
                if (!leaderboard.find(player => player.name === this.username)) {
                    leaderboard.push({ name: this.username, score: this.score });
                }

                // Sort by score and keep top 5
                leaderboard.sort((a, b) => b.score - a.score);
                const topPlayers = leaderboard.slice(0, 5);

                const leaderboardContainer = document.getElementById('leaderboardList');
                leaderboardContainer.innerHTML = '';

                topPlayers.forEach((player, index) => {
                    const playerElement = document.createElement('div');
                    playerElement.className = `leaderboard-item ${player.name === this.username ? 'current-user' : ''}`;
                    playerElement.innerHTML = `
                        <span>${index + 1}. ${player.name}</span>
                        <span>${player.score}</span>
                    `;
                    leaderboardContainer.appendChild(playerElement);
                });

                localStorage.setItem('vocabularyGame_leaderboard', JSON.stringify(leaderboard));
            }

            updateDailyChallenge() {
                const targetWords = 10;
                const progress = Math.min((this.dailyWordsLearned / targetWords) * 100, 100);
                
                document.getElementById('challengeFill').style.width = progress + '%';
                document.getElementById('dailyChallengeText').textContent = 
                    `Learn ${targetWords} words today! (${this.dailyWordsLearned}/${targetWords})`;
            }

            toggleSettings() {
                // Scroll to settings section
                document.querySelector('.settings').scrollIntoView({ 
                    behavior: 'smooth' 
                });
            }

            saveSettings() {
                this.username = document.getElementById('usernameInput').value || 'Player';
                this.currentDifficulty = document.getElementById('settingDifficulty').value;
                this.currentLanguage = document.getElementById('settingLanguage').value;

                // Update header controls
                document.getElementById('difficultySelect').value = this.currentDifficulty;
                document.getElementById('languageSelect').value = this.currentLanguage;

                this.loadCurrentWords();
                this.updateUI();
                this.setupLeaderboard();
                this.saveProgress();
                this.showFeedback('Settings saved successfully!', 'success');
            }

            loadUserProgress() {
                const savedProgress = JSON.parse(localStorage.getItem('vocabularyGame_progress') || '{}');
                
                if (savedProgress.score) this.score = savedProgress.score;
                if (savedProgress.userXP) this.userXP = savedProgress.userXP;
                if (savedProgress.wordsLearned) this.wordsLearned = new Set(savedProgress.wordsLearned);
                if (savedProgress.userLevel) this.userLevel = savedProgress.userLevel;
            }

            saveProgress() {
                const progress = {
                    score: this.score,
                    userXP: this.userXP,
                    wordsLearned: Array.from(this.wordsLearned),
                    userLevel: this.userLevel,
                    username: this.username,
                    dailyWordsLearned: this.dailyWordsLearned
                };

                localStorage.setItem('vocabularyGame_progress', JSON.stringify(progress));
                localStorage.setItem('vocabularyGame_username', this.username);
                localStorage.setItem('dailyWordsLearned', this.dailyWordsLearned.toString());
                
                // Update daily challenge if it's a new day
                const lastPlayDate = localStorage.getItem('lastPlayDate');
                const today = new Date().toDateString();
                
                if (lastPlayDate !== today) {
                    this.dailyWordsLearned = 0;
                    localStorage.setItem('dailyWordsLearned', '0');
                    localStorage.setItem('lastPlayDate', today);
                }
            }
        }

        // Initialize the game when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            const game = new VocabularyGame();
        });
    </script>
</body>
</html>
